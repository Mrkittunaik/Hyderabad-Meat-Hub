<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Checkout | Hyderabad Meat Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Sora:wght@800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css"></head><body>
<nav><a class="logo" href="index.html">Hyderabad <b>Meat</b> Hub</a><div class="links"><a href="index.html">Home</a><a href="our-meat.html">Our Meat</a><a href="quality.html">Quality</a><a href="about.html">About</a><a href="contact.html">Contact</a></div><div class="nr"><a class="ic" href="cart.html" aria-label="Cart"><svg viewBox="0 0 24 24"><path d="M3 4h2l2.5 11h10L20 7H6.5"/><circle cx="9" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/></svg><span id="count">0</span></a><a class="pill" href="our-meat.html">Shop Now</a></div></nav>
<main><style>.lh{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;margin:14px 0 6px}.lh label{margin:0}.mini{background:var(--black);color:#fff;padding:9px 14px;border-radius:2px;font-weight:700;font-size:13px;transition:background .3s}.mini:hover{background:var(--red)}.mini:disabled{opacity:.6}#lc{margin:10px 0 0}</style><div class="ph"><h1 class="big">Check<span>out</span></h1></div><div id="co"></div></main>
<footer><div class="fg">
<div><div class="logo" style="font-size:18px;margin-bottom:16px">Hyderabad <b>Meat</b> Hub</div><p style="max-width:340px;opacity:.7">Exceptional cuts. Freshly prepared. Delivered across Hyderabad.</p></div>
<div><h4>Shop</h4><a href="our-meat.html">Our Meat</a><a href="cart.html">Cart</a></div>
<div><h4>Company</h4><a href="about.html">About</a><a href="quality.html">Quality</a><a href="contact.html">Contact</a></div>
<div><h4>Contact</h4><p>Hyderabad, Telangana</p><a id="fwa" href="#"></a></div></div>
<div class="fb">© 2026 Hyderabad Meat Hub. All rights reserved.</div></footer>
<script src="assets/site.js"></script>
<script>{const a=document.getElementById("fwa");a.href="https://wa.me/"+HMH_CONFIG.whatsapp;a.textContent="WhatsApp: "+HMH_CONFIG.display}</script>
<script>
let loc=null;
const co=document.getElementById("co");
function render(){const it=HMH.items();
if(!it.length){co.innerHTML='<div class="box empty"><p>Your cart is empty.</p><a class="pill" href="our-meat.html">Browse our meat</a></div>';return}
co.innerHTML=`<div class="two"><div class="box"><h2>Your details</h2>
<label>FULL NAME *</label><input id="nm" autocomplete="name" placeholder="Your name">
<label>PHONE NUMBER *</label><input id="ph" type="tel" inputmode="tel" autocomplete="tel" placeholder="10-digit mobile number">
<div class="lh"><label>DELIVERY ADDRESS *</label><button type="button" class="mini" id="gl">📍 Get exact location</button></div><textarea id="ad" placeholder="House no, street, area"></textarea><div class="loc" id="lc">Tap "Get exact location" and allow location access so we can find you exactly.</div>
<label>LANDMARK</label><input id="lm" placeholder="Near...">
<label>NOTES (cut type, timing...)</label><textarea id="nt"></textarea>
</div>
<div class="box"><h2>Your order</h2>${it.map(({p,q})=>`<div class="row"><div class="th">${HMH.img(p)}</div><div class="nm">${p.name}<small>${q} kg × ${inr(p.price)}</small></div><div class="lt">${inr(p.price*q)}</div></div>`).join("")}
<div class="tot"><span>Total</span><em>${inr(HMH.total())}</em></div><p class="note">Payment on delivery. Delivery charges confirmed on WhatsApp.</p>
<button type="button" class="btn wa" id="go">Place order on WhatsApp</button><a href="cart.html" class="note" style="display:block;text-align:center;margin-top:12px">← Edit cart</a></div></div>`;
document.getElementById("gl").onclick=getLoc;document.getElementById("go").onclick=order}

function showLoc(){const lc=document.getElementById("lc");lc.className="loc ok";
 const d=.003,bb=[loc.lng-d,loc.lat-d,loc.lng+d,loc.lat+d].join("%2C");
 lc.innerHTML=`<b>Location captured ✓</b> (accuracy ~${loc.acc} m)${loc.acc>100?"<br>Accuracy is low. Move near a window/outdoors and tap Update, or add a landmark.":""}
 <div id="area" style="margin-top:8px">${loc.area?"📍 <b>"+loc.area+"</b><br>"+loc.full:"Finding your area name..."}</div>
 <iframe title="Map preview" style="width:100%;height:200px;border:0;border-radius:2px;margin-top:10px" loading="lazy" src="https://www.openstreetmap.org/export/embed.html?bbox=${bb}&layer=mapnik&marker=${loc.lat}%2C${loc.lng}"></iframe>
 <a target="_blank" rel="noopener" href="https://www.google.com/maps?q=${loc.lat},${loc.lng}">Open in Google Maps</a>`}
function geocode(){const here=loc;
 fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&addressdetails=1&zoom=18&lat=${here.lat}&lon=${here.lng}`,{headers:{"Accept-Language":"en"}})
 .then(r=>r.json()).then(j=>{if(loc!==here||!j||!j.display_name)throw 0;const a=j.address||{};
  here.area=[a.road,a.neighbourhood||a.suburb||a.city_district,a.city||a.town||a.village||a.state_district].filter(Boolean).join(", ")||j.display_name.split(",").slice(0,3).join(",");
  here.full=j.display_name;showLoc();
  const ad=document.getElementById("ad");if(!ad.value.trim()||ad.dataset.auto){ad.value=here.full;ad.dataset.auto="1"}
  ad.oninput=()=>{delete ad.dataset.auto}})
 .catch(()=>{const e=document.getElementById("area");if(e)e.textContent="Could not fetch area name. Please type your address."})}
function getLoc(){const lc=document.getElementById("lc"),b=document.getElementById("gl");
if(!navigator.geolocation){lc.className="loc err";lc.textContent="Location is not supported on this browser. Please type your full address.";return}
b.disabled=true;b.textContent="Getting location...";lc.className="loc";lc.textContent="Finding your exact location, please wait...";
navigator.geolocation.getCurrentPosition(pos=>{loc={lat:pos.coords.latitude,lng:pos.coords.longitude,acc:Math.round(pos.coords.accuracy)};
 b.disabled=false;b.textContent="📍 Update location";showLoc();geocode()},
 err=>{b.disabled=false;b.textContent="📍 Get exact location";lc.className="loc err";
 lc.textContent=err.code==1?"Location permission denied. Allow location for this site in your browser settings, or type your address and landmark.":"Could not get location. Turn on GPS and try again. (Needs https:// link.)"},
 {enableHighAccuracy:true,timeout:20000,maximumAge:0})}
function order(){const v=id=>document.getElementById(id).value.trim(),nm=v("nm"),ph=v("ph"),ad=v("ad");
if(!nm||!ad){alert("Please enter your name and delivery address.");return}
if(ph.replace(/\D/g,"").length<10){alert("Please enter a valid 10-digit phone number.");return}
if(!loc&&!confirm("You have not shared your exact location. Order without it?"))return;
const it=HMH.items(),id="HMH"+Date.now().toString().slice(-6);
let m=`*New Order ${id} - Hyderabad Meat Hub*\n\n*Items:*\n`+it.map(({p,q},i)=>`${i+1}. ${p.name} - ${q} kg x ${inr(p.price)} = ${inr(p.price*q)}`).join("\n")+
`\n\n*Total: ${inr(HMH.total())}*\n\n*Customer:*\nName: ${nm}\nPhone: ${ph}\nAddress: ${ad}`+(v("lm")?`\nLandmark: ${v("lm")}`:"")+(v("nt")?`\nNotes: ${v("nt")}`:"")+
`\n\n*Location:* `+(loc?(loc.area?`${loc.area}\n`:"")+`https://www.google.com/maps?q=${loc.lat},${loc.lng} (accuracy ~${loc.acc} m)`:"Not shared");
const url="https://wa.me/"+HMH_CONFIG.whatsapp+"?text="+encodeURIComponent(m);
HMH.clear();
co.innerHTML=`<div class="box empty"><h2>Almost done!</h2><p>WhatsApp should open with your order. Just press Send there.</p><a class="btn wa" href="${url}">Open WhatsApp again</a><a class="pill" style="margin-top:16px" href="index.html">Back to home</a></div>`;
location.href=url}
render();</script></body></html>
